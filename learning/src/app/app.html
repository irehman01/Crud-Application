<h1>Student Management</h1>

<form (ngSubmit)="saveStudent()">

  <input
    type="text"
    [(ngModel)]="student.name"
    name="name"
    placeholder="Enter name"
  />

  <input
    type="email"
    [(ngModel)]="student.email"
    name="email"
    placeholder="Enter email"
  />

  <input
    type="number"
    [(ngModel)]="student.age"
    name="age"
    placeholder="Enter age"
  />

  <button type="submit">
    {{ editing ? 'Update Student' : 'Add Student' }}
  </button>

  @if (editing) {
    <button type="button" (click)="cancelEdit()">
      Cancel
    </button>
  }

</form>

<hr>

<h2>Students</h2>

<table border="1">

  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>

    @for (student of students; track student.id) {
      <tr>
        <td>{{ student.id }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.email }}</td>
        <td>{{ student.age }}</td>

        <td>
          <button (click)="editStudent(student)">
            Edit
          </button>

          <button (click)="deleteStudent(student.id)">
            Delete
          </button>
        </td>
      </tr>
    }

  </tbody>

</table>
